name: Backtest

# Ejecucion manual desde la pestaña Actions -> Backtest -> Run workflow.
# El resumen aparece en la pagina de la ejecucion y los CSV quedan como
# artefacto descargable ("resultados-backtest").
on:
  workflow_dispatch:
    inputs:
      estudio:
        description: 'bot = backtest del bot Quant; alternativas = SPY vs A vs B vs bot; fundamental = ranking actual del satelite; fundamental_historico = backtest del satelite con SimFin'
        type: choice
        options: [bot, alternativas, fundamental, fundamental_historico]
        default: bot
      aporte:
        description: 'Solo alternativas: aporte mensual en USD'
        default: '100'
      periodo:
        description: 'Historia a descargar (yfinance: 5y, 10y, max)'
        default: '10y'
      walk_forward:
        description: 'Incluir walk-forward (validacion fuera de muestra, ~5 min)'
        type: boolean
        default: true
      capital:
        description: 'Capital inicial en USD (vacio = CAPITAL_INICIAL de quant_core)'
        default: ''
      spread:
        description: 'Spread por lado en % (0.05 = acciones reales; 0.15 = tabla CFD, escenario pesimista)'
        default: '0.05'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar backtest
        env:
          PERIODO: ${{ github.event.inputs.periodo }}
          WALK_FORWARD: ${{ github.event.inputs.walk_forward }}
          CAPITAL: ${{ github.event.inputs.capital }}
          SPREAD: ${{ github.event.inputs.spread }}
          ESTUDIO: ${{ github.event.inputs.estudio }}
          APORTE: ${{ github.event.inputs.aporte }}
          SIMFIN_API_KEY: ${{ secrets.SIMFIN_API_KEY }}
        run: |
          if [ "$ESTUDIO" = "fundamental_historico" ]; then
            pip install simfin
            ARGS="--salida resultados"
            if [ -n "$CAPITAL" ]; then ARGS="$ARGS --capital $CAPITAL"; fi
            python backtest_fundamental.py $ARGS
            cat resultados/fundamental_backtest.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$ESTUDIO" = "fundamental" ]; then
            mkdir -p resultados
            python fundamental.py | tee resultados/fundamental.txt
            { echo '```'; cat resultados/fundamental.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$ESTUDIO" = "alternativas" ]; then
            ARGS="--salida resultados --aporte ${APORTE:-100}"
            if [ -n "$CAPITAL" ]; then ARGS="$ARGS --capital $CAPITAL"; fi
            python estrategias.py $ARGS
            cat resultados/estrategias.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ARGS="--periodo ${PERIODO:-10y} --salida resultados"
          if [ "$WALK_FORWARD" = "true" ]; then ARGS="$ARGS --walk-forward"; fi
          if [ -n "$CAPITAL" ]; then ARGS="$ARGS --capital $CAPITAL"; fi
          if [ -n "$SPREAD" ]; then ARGS="$ARGS --spread $SPREAD"; fi
          python backtest.py $ARGS
          cat resultados/resumen.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-backtest
          path: resultados/
          if-no-files-found: ignore
