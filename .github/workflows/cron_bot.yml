name: Ejecucion Diaria Bot Quant

on:
  schedule:
    # 20:30 UTC es 15:30 en Nueva York (ideal para señales de cierre)
    - cron: '30 20 * * 1-5'
  workflow_dispatch: # Botón para ejecutarlo manualmente

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Python Setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libs
        run: pip install yfinance pandas numpy requests

      - name: Run Quant Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_final.py
