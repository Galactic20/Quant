name: Quant Bot Diario

on:
  schedule:
    # GitHub Actions free tier tiene un retraso tipico de 30-45 minutos.
    # Los crons estan configurados 45 min antes del objetivo para compensarlo.
    #
    # HORARIO ACTIVO: EDT (verano, mar-nov) — NY = UTC-4
    #
    # APERTURA — objetivo: 8:45 AM NY
    #   EDT verano  (mar-nov): 12:00 UTC + ~45min = 12:45 UTC = 8:45 AM NY  ← ACTIVO
    #   EST invierno (nov-mar): 13:00 UTC + ~45min = 13:45 UTC = 8:45 AM NY  (cambiar en nov)
    - cron: '00 12 * * 1-5'

    # CIERRE — objetivo: 3:55 PM NY
    #   EDT verano  (mar-nov): 19:10 UTC + ~45min = 19:55 UTC = 3:55 PM NY  ← ACTIVO
    #   EST invierno (nov-mar): 20:10 UTC + ~45min = 20:55 UTC = 3:55 PM NY  (cambiar en nov)
    - cron: '10 19 * * 1-5'

    # Para verificar o ajustar horarios: https://crontab.guru
    # Cuando vuelva EST en noviembre: cambiar 12->13 y 19->20

  # Ejecucion manual -> siempre corre en MODO CIERRE (escaner completo)
  workflow_dispatch:

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necesario para el git push de posiciones.json

    steps:

      # 1. Descarga el codigo del repositorio al servidor de GitHub
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Instala Python 3.11
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Cache de pip para acelerar ejecuciones futuras
      - name: Cache de pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: quant-pip-v1

      # 4. Instala las librerias de Python necesarias
      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests tabulate

      # 5. Ejecuta el bot usando los secretos de Telegram
      #    Configurar en: GitHub repo > Settings > Secrets > Actions
      #    Crear dos secretos: TELEGRAM_TOKEN y TELEGRAM_CHAT_ID
      - name: Ejecutar Quant Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_telegram.py

      # 6. Si posiciones.json cambio (nueva compra o cierre),
      #    lo guarda de vuelta al repositorio automaticamente
      - name: Guardar posiciones.json
        run: |
          git config user.name  'Quant Bot'
          git config user.email 'bot@quant.local'
          git add posiciones.json chandelier_prev.json || true
          git diff --staged --quiet || git commit -m 'Auto: posiciones y chandelier actualizados'
          git push

