name: Bot de Inversión - Cartera ETF + Satélite

on:
  schedule:
    # GitHub Actions free tier tiene un retraso tipico de 30-45 minutos.
    # Los crons estan configurados 45 min antes del objetivo para compensarlo.
    #
    # Hay crons para AMBOS horarios de Nueva York. bot_telegram.py detecta si
    # hoy rige EDT o EST y omite el cron que no corresponde, asi que ya no hay
    # que editar este archivo en marzo/noviembre. Tambien omite fines de semana
    # y feriados de NYSE.
    #
    # APERTURA — objetivo: 8:45 AM NY
    - cron: '0 12 * * 1-5'   # EDT verano  (mar-nov): 12:00 UTC + ~45min
    - cron: '0 13 * * 1-5'   # EST invierno (nov-mar): 13:00 UTC + ~45min

    # CIERRE — objetivo: 3:55 PM NY
    - cron: '10 19 * * 1-5'  # EDT verano  (mar-nov): 19:10 UTC + ~45min
    - cron: '10 20 * * 1-5'  # EST invierno (nov-mar): 20:10 UTC + ~45min

    # Para verificar o ajustar horarios: https://crontab.guru
    # Si cambias las horas, actualiza tambien CRONES en bot_telegram.py

  # Ejecucion manual desde la pestaña Actions
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecucion'
        type: choice
        options: [cierre, apertura]
        default: cierre

# Evita dos ejecuciones simultaneas que compitan al guardar posiciones.json
concurrency:
  group: quant-bot
  cancel-in-progress: false

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necesario para el git push de posiciones.json

    steps:

      # 1. Descarga el codigo del repositorio al servidor de GitHub
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      # 2. Instala Python 3.11 con cache de pip (se invalida al cambiar requirements.txt)
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # 3. Instala las librerias de Python necesarias
      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Ejecuta el bot usando los secretos de Telegram
      #    Configurar en: GitHub repo > Settings > Secrets > Actions
      #    Crear dos secretos: TELEGRAM_TOKEN y TELEGRAM_CHAT_ID
      - name: Ejecutar bot de inversion
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRON_PROGRAMADO: ${{ github.event.schedule }}
          MODO_MANUAL: ${{ github.event.inputs.modo }}
        run: python bot_telegram.py

      # 5. Si la cartera modelo, el satelite u otros archivos de estado
      #    cambiaron, los guarda de vuelta al repositorio automaticamente
      - name: Guardar estado de las carteras
        run: |
          git config user.name  'Quant Bot'
          git config user.email 'bot@quant.local'
          for f in posiciones.json chandelier_prev.json datos/cartera_modelo.json datos/satelite_modelo.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m 'Auto: cartera y posiciones actualizadas'
          # Si editaste posiciones.json mientras corria el bot, integra tu cambio
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
